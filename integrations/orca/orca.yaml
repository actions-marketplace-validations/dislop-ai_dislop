# Orca ADE configuration template for dislop
# Copies/symlinks gitignored local rules into each worktree and blocks core AI artifacts before review.

worktree:
  symlinkPaths:
    - .dislop.local.json

hooks:
  preReview:
    - name: dislop-gate
      command: npx --yes dislop check --changed origin/main --fail-on error
