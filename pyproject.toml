[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dislop"
version = "0.2.0"
description = "Deterministic pre-publication deliverable linter and revision verifier across prose, HTML/CSS/SVG, DOCX, PPTX, and PDF (CLI & MCP)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "dislop contributors" }
]
keywords = ["anti-slop", "ai-slop", "linter", "proofreading", "mcp", "editorial", "quality-gate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://dislop.com"
Repository = "https://github.com/dislop-ai/dislop"
Issues = "https://github.com/dislop-ai/dislop/issues"

[project.scripts]
dislop = "dislop.cli:main"
dislop-mcp = "dislop.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dislop"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "dislop/packs"
