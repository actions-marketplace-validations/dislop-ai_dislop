name: CI & Self-Dogfood

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python test suite (prose, OOXML .docx/.pptx, MCP)
        run: python3 tests/test_engine.py

      - name: Dogfood Python CLI across repository docs & SVGs
        run: |
          PYTHONPATH=src python3 -m dislop.cli check .
          PYTHONPATH=src python3 -m dislop.cli check README.zh-CN.md --pack literary-essay

      - name: Dogfood Node.js CLI & MCP server
        run: |
          node ./bin/dislop.mjs check .
          node ./bin/dislop.mjs packs
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' | node ./bin/dislop-mcp.mjs
