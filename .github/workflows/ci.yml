name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit and integration tests
        run: npm test
      - name: Verify Pack supply-chain security and language purity
        run: npm run check:security
      - name: Assert dislop-bench v3 quality & Fact Gate thresholds
        run: npm run bench:assert
      - name: Dogfood deterministic checks on README
        run: npm run dogfood
