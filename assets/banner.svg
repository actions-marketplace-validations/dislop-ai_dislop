  <line x1="296" y1="40" x2="296" y2="260" stroke="#D6D3CD" stroke-width="1.5"/>

  <!-- Left Proofreader Stamp (180x180 at x=58, y=60) -->
  <g transform="translate(58, 60) scale(0.3515625)">
    <rect width="512" height="512" rx="108" fill="#141413"/>
    <rect x="20" y="20" width="472" height="472" rx="90" stroke="#292826" stroke-width="4"/>
    <rect x="112" y="134" width="288" height="38" rx="7" fill="#F7F5F0"/>
    <rect x="112" y="237" width="288" height="38" rx="7" fill="#6B6661"/>
    <rect x="112" y="340" width="218" height="38" rx="7" fill="#F7F5F0"/>
    <circle cx="380" cy="359" r="20" fill="#D9381E"/>
    <line x1="342" y1="110" x2="170" y2="402" stroke="#141413" stroke-width="60" stroke-linecap="round"/>
    <line x1="342" y1="110" x2="170" y2="402" stroke="#D9381E" stroke-width="34" stroke-linecap="round"/>
