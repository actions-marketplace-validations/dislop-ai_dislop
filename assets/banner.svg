  <!-- Right Editorial Masthead -->
  <text x="344" y="72" fill="#D9381E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.2">CROSS-MODAL QUALITY GATE · CLI &amp; MCP</text>

  <text x="342" y="144" fill="#141413" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.2">dislop</text>
  <rect x="554" y="106" width="66" height="28" rx="6" fill="#D9381E"/>
  <text x="587" y="125" text-anchor="middle" fill="#F7F5F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">v0.1.0</text>

  <text x="344" y="186" fill="#1C1917" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, sans-serif" font-size="20" font-weight="600">Catch AI prose clichés, layout collisions, and slide word-walls before delivery.</text>
  <text x="344" y="216" fill="#57534E" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', -apple-system, sans-serif" font-size="16" font-weight="400">在文章、网页、演示稿与办公文档发出前，定位套话、版式越界与生成痕迹 · 可插拔审美包</text>

