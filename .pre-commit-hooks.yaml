- id: dislop-check
  name: dislop anti-slop check (core AI artifacts)
  description: Catch stray chatbot greetings, unfilled placeholders, raw Markdown in Office docs, and dead UI controls before commit.
  entry: dislop check --fail-on error
  language: python
  files: \.(md|mdx|txt|html|htm|css|jsx|tsx|svg|docx|pptx)$

- id: dislop-check-strict
  name: dislop anti-slop strict check (fail on warning)
  description: Fail commit on both core AI artifacts and scenario cliché/template warnings.
  entry: dislop check --fail-on warning
  language: python
  files: \.(md|mdx|txt|html|htm|css|jsx|tsx|svg|docx|pptx)$
